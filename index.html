<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parkomat – Haim</title>
  <style>
    body {font-family: Arial, Helvetica, sans-serif; background:#f4f4f4; margin:0; padding:20px 16px; direction: rtl; text-align: right; color:#1f2937;}
    .container {max-width:600px; margin:auto; background:#fff; padding:20px; box-shadow:0 0 10px rgba(0,0,0,0.1); border-radius:6px;}
    h1 {color:#1e90ff; text-align:center; margin-top:8px;}
    img {display:block; margin:auto; max-width:150px;}
    label {display:block; margin-top:15px;}
    input, select, textarea {width:100%; box-sizing:border-box; padding:8px; margin-top:5px; border:1px solid #ccc; border-radius:4px; font:inherit;}
    button {margin-top:20px; background:#1e90ff; color:#fff; border:none; padding:12px; width:100%; font-size:16px; border-radius:4px; cursor:pointer;}
    button:hover {background:#187bcd;}
    button:disabled {background:#9cc8f3; cursor:wait;}
    #result {margin-top:20px; padding:14px; border-radius:4px; background:#eef6ff; border:1px solid #cfe3fb; line-height:1.6;}
    #result.err {background:#fff1f1; border-color:#f5c2c2;}
    #result p {margin:4px 0;}
    .links {margin-top:22px; font-size:14px; text-align:center; color:#555;}
    .links a {color:#1e90ff;}
  </style>
</head>
<body>
  <div class="container">
    <h1>Parkomat – Haim</h1>
    <img src="logo.svg" alt="Parkomat Logo" />
    <p>העלה קובץ אל מערכת Parkomat. סוכן Parkomat קורא אותו וכותב סיכום, והקובץ נשמר ב‑Google Drive או נשלח ל‑Slack, לפי היעד והמחלקה שבחרת. עותק מגיע גם במייל.</p>
    <form id="uploadForm" novalidate>
      <label for="message">הודעה (אופציונלי)</label>
      <textarea id="message" name="message" rows="2" maxlength="1500" placeholder="הודעה למערכת"></textarea>

      <label for="destination">יעד העלאה</label>
      <select id="destination" name="destination">
        <option value="drive">Google Drive</option>
        <option value="slack">Slack</option>
      </select>

      <label for="department">מחלקה</label>
      <input type="text" id="department" name="department" maxlength="40" placeholder="לדוגמה: operations, sales, support" required />

      <label for="file">קובץ להעלאה (עד 15MB)</label>
      <input type="file" id="file" name="file" required />

      <button type="submit" id="send">העלה</button>
    </form>
    <div id="result" hidden aria-live="polite"></div>
    <p class="links">שאלונים, תכנון חניון וסוכני Parkomat: <a href="https://devopsdevopshaim-wq.github.io/devops-hub/robotic-parking/#ask">פארק־פלאן</a> · <a href="https://devopsdevopshaim-wq.github.io/devops-hub/portfolio/">תיק העבודות</a></p>
    <script>
      // Parkomat runs in n8n Cloud (it used to need the local n8n at localhost:5679).
      const ENDPOINT = 'https://haimkripisn.app.n8n.cloud/webhook/parking-agents';
      const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const lines = (t) => esc(t).split(/\n/).map((l) => l.trim()).filter(Boolean)
        .map((l) => '<p>' + l.replace(/^#+\s*/, '').replace(/^[-*•]\s*/, '• ').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>') + '</p>').join('');
      const out = document.getElementById('result');
      const show = (html, err) => { out.hidden = false; out.className = err ? 'err' : ''; out.innerHTML = html; };
      document.getElementById('uploadForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const form = e.target, file = form.file.files[0];
        if (!form.department.value.trim()) return show('כתבו מחלקה.', true);
        if (!file) return show('בחרו קובץ.', true);
        if (file.size > 15 * 1048576) return show('הקובץ גדול מ‑15MB.', true);
        const formData = new FormData();
        formData.append('message', form.message.value);
        formData.append('destination', form.destination.value);
        formData.append('department', form.department.value.trim());
        formData.append('file', file, file.name);
        const btn = document.getElementById('send');
        btn.disabled = true; btn.textContent = 'Parkomat קורא את הקובץ…';
        try {
          const resp = await fetch(ENDPOINT, { method: 'POST', body: formData });
          const j = await resp.json().catch(() => ({}));
          if (!resp.ok || !j.ok) throw new Error(j.message || 'שגיאה ' + resp.status);
          show('<p><b>' + esc(j.message || 'הקובץ התקבל.') + '</b>' + (j.link ? ' <a href="' + esc(j.link) + '" target="_blank" rel="noopener">פתיחה</a>' : '') + '</p>' + lines(j.summary || ''));
          form.file.value = '';
        } catch (err) {
          show('לא הצלחנו לשלוח: ' + esc(err.message) + '. נסו שוב בעוד דקה.', true);
        } finally {
          btn.disabled = false; btn.textContent = 'העלה';
        }
      });
    </script>
  </div>
</body>
</html>
